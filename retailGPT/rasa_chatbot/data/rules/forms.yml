version: "3.1"

rules:

  - rule: Démarrer le formulaire de paiement
    condition:
    - active_loop: null
    steps:
      - intent: finish_purchase
      - action: payment_method_form
      - active_loop: payment_method_form

  - rule: Transition du formulaire paiement vers confirmation
    steps:
      - action: payment_method_form
      - active_loop: payment_method_form
      - active_loop: null
      - action: summarize_details
      - action: confirmation_form
      - slot_was_set:
        - modify_details: null

  - rule: Déclencher correct_detail après confirmation_form
    steps:
      - action: confirmation_form
      - active_loop: confirmation_form
      - active_loop: null
      - slot_was_set:
        - modify_details: "set"
      - action: correct_detail
