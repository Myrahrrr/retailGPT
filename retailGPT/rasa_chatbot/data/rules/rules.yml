version: "3.1"

rules:

  - rule: Répondre si l'utilisateur demande si c'est un bot
    steps:
    - intent: bot_challenge
    - action: utter_iamabot

  - rule: Répondre au revoir
    steps:
    - intent: goodbye
    - action: utter_goodbye

  - rule: Retourner le statut du panier
    steps:
    - intent: cart_status
    - action: return_cart_status
