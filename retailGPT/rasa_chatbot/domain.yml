version: '3.1'

forms:
  payment_method_form:
    required_slots:
    - payment_method
  confirmation_form:
    required_slots:
    - modify_details

entities:
- payment_method
- modify_details

slots:
  payment_method:
    type: text
    mappings:
    - type: from_entity
      entity: payment_method
      conditions:
      - active_loop: payment_method_form
        requested_slot: payment_method
  modify_details:
    type: text
    mappings:
    - type: from_entity
      entity: modify_details
      conditions:
      - active_loop: confirmation_form
        requested_slot: modify_details

intents:
- affirm
- bot_challenge
- conversation
- deny
- finish_purchase
- goodbye
- greet
- inform
- nlu_fallback
- cart_status

actions:
- utter_greet
- utter_goodbye
- correct_detail
- llm_processing
- summarize_details
- validate_payment_method_form
- validate_confirmation_form
- action_default_fallback
- return_cart_status

responses:
  utter_greet:
  - text: |
      Bonjour ! Je suis votre assistant en ligne. Je suis là pour vous aider à trouver des produits et constituer votre panier. Comment puis-je vous aider ?
  utter_goodbye:
  - text: Au revoir ! N'hésitez pas à revenir si vous avez besoin d'aide.
  utter_iamabot:
  - text: Je suis un assistant virtuel. Comment puis-je vous aider ?
  utter_ask_payment_method:
  - text: 'Choisissez votre mode de paiement :'
    buttons:
    - title: Espèces
      payload: /inform{"payment_method":"Espèces"}
    - title: Carte bancaire
      payload: /inform{"payment_method":"Carte bancaire"}
    - title: Sans contact
      payload: /inform{"payment_method":"Sans contact"}
  utter_ask_modify_details:
  - text: ''
    buttons:
    - title: Modifier le mode de paiement
      payload: /inform{"modify_details":"payment_method"}
    - title: Modifier la commande
      payload: /inform{"modify_details":"cart"}
    - title: Tout est correct !
      payload: /inform{"modify_details":"ok"}
  utter_default:
  - text: Désolé, je n'ai pas compris. Pouvez-vous reformuler ?
  - text: Je n'ai pas compris. Pouvez-vous dire autrement ?

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
